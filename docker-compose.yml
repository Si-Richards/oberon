services:
  oberon:
    build: .
    image: oberon-market-maker:v0.9.1
    container_name: binance-market-maker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - oberon-data:/data
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  oberon-data:
    name: ${OBERON_VOLUME_NAME:-oberon-market-maker-v090_oberon-data}
